kind = "web"
previewPath = "/"
title = "AI Startup Evaluation System"
version = "1.0.0"
id = "artifacts/startup-eval"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25659

[services.development]
run = "pnpm --filter @workspace/startup-eval run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/startup-eval", "run", "build" ]
publicDir = "artifacts/startup-eval/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25659"
BASE_PATH = "/"
